[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bioml-data"
version = "0.0.0"
description = "Reproducible data protocols for trustworthy biological machine learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12",
    "httpx2[brotli,http2,zstd]>=2.12.0",
    "pydantic>=2.11",
    "rich>=14",
    "typer>=0.16",
]

[project.scripts]
bioml-data = "bioml_data._cli:app"

[project.optional-dependencies]
notebook = [
    "ipykernel>=7",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "scanpy>=1.11",
    "scipy>=1.16",
]

[project.urls]
Documentation = "https://github.com/leevimth/bioml-data#readme"
Issues = "https://github.com/leevimth/bioml-data/issues"
Repository = "https://github.com/leevimth/bioml-data"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "ruff>=0.12",
    "scipy-stubs>=1.16",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"examples/**/*.ipynb" = ["S101", "T201"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
